<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f9e8df">
<title>A little private birthday story for Ayu ♡</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f6e9e5;color:#6f3f4b}
body{display:grid;place-items:center;padding:20px}.card{width:min(520px,94vw);background:#fffdfa;border:1px solid #ead5d5;box-shadow:0 30px 100px rgba(90,58,62,.16);padding:48px 30px 38px;text-align:center}.ey{font-size:9px;letter-spacing:.3em;color:#b67b84;text-transform:uppercase}.script{font-family:cursive;color:#b64d68}.card h1{font:500 clamp(48px,8vw,76px)/.9 Georgia;margin:24px 0 12px}.card p{font-size:12px;line-height:1.7;color:#8f777d}.email{width:min(360px,100%);padding:14px;border:1px solid #dfcfd0;text-align:center;color:#6f3f4b;outline:none}.btn{margin-top:10px;width:min(360px,100%);padding:14px;border:1px solid #6f3f4b;background:#6f3f4b;color:#fff;cursor:pointer;letter-spacing:.1em;text-transform:uppercase}.msg{min-height:24px;margin-top:12px;font-size:11px;color:#9a5263}
</style>
</head>
<body>
<div class="card">
<div class="ey">private birthday room ♡</div>
<h1>Only for <span class="script">Ayu.</span></h1>
<p>Enter one of the two invited email addresses. Your private sign-in link will unlock the birthday world.</p>
<input id="email" class="email" type="email" autocomplete="email" placeholder="invited email address">
<button id="send" class="btn">Send private link ♡</button>
<div id="msg" class="msg"></div>
</div>
<script>
const URL="https://qveyfroqvwtxrdyxegyo.supabase.co";
const KEY="sb_publishable_giVyhlNId5_moWzAZki8wQ_f4-xXSNq";
const sb=supabase.createClient(URL,KEY);
const email=document.getElementById("email"),send=document.getElementById("send"),msg=document.getElementById("msg");
async function loadPrivate(){
 msg.textContent="Checking private access…";
 const {data:{session}}=await sb.auth.getSession();
 if(!session){msg.textContent="";return}
 const res=await fetch(URL+"/functions/v1/private-birthday-content",{headers:{Authorization:"Bearer "+session.access_token}});
 if(!res.ok){await sb.auth.signOut();msg.textContent="This email is not authorized. ♡";return}
 const content=await res.text();
 document.open();document.write(content);document.close();
}
send.onclick=async()=>{
 const e=email.value.trim().toLowerCase();
 if(!e){msg.textContent="Enter your invited email first ♡";return}
 send.disabled=true;msg.textContent="Sending your private link…";
 const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:"https://imaryansmith.github.io/Ayu-Birthday/"}});
 send.disabled=false;
 msg.textContent=error?"Couldn't send the link. Please try again.":"Link sent. Open the email link on this page. ♡";
};
sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_IN"&&session)loadPrivate()});
loadPrivate();
</script>
</body>
</html>
